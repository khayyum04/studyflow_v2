[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "studyflow"
version = "0.1.0"
requires-python = ">=3.9"
dynamic = ["dependencies"]

[project.scripts]
studyflow = "backend.rag_pipeline.cli:cli"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.uv.workspace]
members = [
    "awesome-project",
]
